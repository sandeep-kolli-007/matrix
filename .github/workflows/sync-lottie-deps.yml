name: Sync Lottie dependencies

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-lottie-deps.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Lottie dependencies
        run: npm install lottie-react-native@7.5.0 @lottiefiles/dotlottie-react

      - name: Commit dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: add Lottie runtime dependencies"
          git push
